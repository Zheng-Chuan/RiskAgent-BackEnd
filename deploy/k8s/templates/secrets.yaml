apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
{{- include "riskagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | default "root" | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.database | default "riskagent" | quote }}
  MYSQL_USER: {{ .Values.mysql.user | default "admin" | quote }}
  MYSQL_PASSWORD: {{ .Values.mysql.password | default "change_me" | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | quote }}
  LLM_API_KEY: {{ .Values.llm.apiKey | default "" | quote }}
  GF_SECURITY_ADMIN_USER: {{ .Values.grafana.adminUser | default "admin" | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | default "admin" | quote }}
