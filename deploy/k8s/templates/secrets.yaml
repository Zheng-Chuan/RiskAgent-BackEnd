apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
{{- include "riskagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 敏感凭据必须显式提供, 缺失时 helm 直接报错 (禁止静默回退弱密码)
  MYSQL_ROOT_PASSWORD: {{ required "mysql.rootPassword 必须设置 (禁止使用默认弱密码)" .Values.mysql.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.database | default "riskagent" | quote }}
  MYSQL_USER: {{ required "mysql.user 必须设置" .Values.mysql.user | quote }}
  MYSQL_PASSWORD: {{ required "mysql.password 必须设置 (禁止使用默认弱密码)" .Values.mysql.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | quote }}
{{- if .Values.redis.password }}
  # 带密码的 REDIS_URL: envFrom 中 secretRef 排在 configMapRef 之后, 覆盖明文配置
  REDIS_URL: {{ printf "redis://:%s@%s:%s/%s" .Values.redis.password (.Values.redis.host | default "redis") (.Values.redis.port | default "6379" | toString) (.Values.redis.db | default "0" | toString) | quote }}
{{- end }}
  LLM_API_KEY: {{ .Values.llm.apiKey | default "" | quote }}
  # embedding 专用 key (DeepSeek 官方无 embeddings 端点, 指向硅基流动等供应商; 为空时回退 LLM_API_KEY)
  LLM_EMBEDDING_API_KEY: {{ .Values.llm.embeddingApiKey | default "" | quote }}
  RISKAGENT_API_TOKEN: {{ .Values.security.apiToken | default "" | quote }}
  GF_SECURITY_ADMIN_USER: {{ .Values.grafana.adminUser | default "admin" | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ required "grafana.adminPassword 必须设置 (禁止使用默认弱密码)" .Values.grafana.adminPassword | quote }}
