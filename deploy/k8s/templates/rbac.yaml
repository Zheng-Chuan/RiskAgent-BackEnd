{{/*
ServiceAccount + RBAC for K8sDataSource perception.
授权 mcp-server Pod 读取 Pod 列表与 metrics.k8s.io，用于 k8s_source.py 采集容器状态。
*/}}
{{- if .Values.serviceAccount.create | default true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "riskagent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-pod-reader
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "riskagent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-pod-reader
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "riskagent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-mcp
    namespace: {{ .Release.Namespace }}
{{- end }}
