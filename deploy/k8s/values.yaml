# Helm Chart 默认配置
# 对应 .env.example 的所有配置项

# 全局镜像仓库前缀（默认空 = Docker Hub，可设为私有 registry 如 "registry.example.com/"）
global:
  imageRegistry: ""
  imagePullSecrets: []
  # - name: volc-cr-secret

# 镜像配置
image:
  repository: riskagent/backend
  tag: latest
  pullPolicy: IfNotPresent

# MySQL 配置
mysql:
  host: mysql
  port: "3306"
  database: riskagent
  user: admin
  password: change_me
  rootPassword: root
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  persistence:
    size: "10Gi"

# Redis 配置
redis:
  host: redis
  port: "6379"
  db: "0"
  password: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    size: "5Gi"

# ChromaDB 配置
chroma:
  host: chroma
  port: "8000"
  collection: riskagent-alerts
  memoryCollection: riskagent-memory
  skillsCollection: riskagent-skills
  image: chromadb/chroma:0.5.0
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  persistence:
    size: "5Gi"

# MCP Server 配置
mcp:
  replicas: "1"
  transport: streamable-http
  host: "0.0.0.0"
  port: "8000"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1500m"
      memory: "1536Mi"

# Ingress 配置
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  paths:
    - path: /api
      pathType: Prefix
    - path: /health
      pathType: Prefix
    - path: /metrics
      pathType: Prefix
  tls: []

# ServiceAccount 配置
# 为 mcp-server Pod 创建 SA 并授予 Pod 读取权限（K8sDataSource 感知所需）
serviceAccount:
  create: true
  name: ""

# 应用配置
app:
  env: production
  logLevel: INFO

# 安全配置
# apiToken: REST API / metrics / MCP 工具的 Bearer Token, 生产环境必须设置
# allowUnauthenticated: 未配置 apiToken 时是否放行请求(仅限本地/测试环境)
security:
  apiToken: ""
  allowUnauthenticated: "false"

# 记忆配置
memory:
  semanticEnabled: "true"
  ttl: "86400"
  maxLen: "2000"

# LLM 配置
llm:
  apiKey: ""
  baseUrl: https://openrouter.ai/api/v1
  model: deepseek/deepseek-v4-pro
  httpReferer: ""
  appTitle: ""
  embeddingModel: text-embedding-3-small

# Skill 语义检索配置 (RFC-005)
skill:
  queryRewriteEnabled: "true"
  queryRewriteTimeout: "3.0"
  queryRewriteCacheSize: "256"
  hybridVectorWeight: "0.7"

# Prometheus 配置
prometheus:
  enabled: true
  image: prom/prometheus:v2.48.0
  host: prometheus    # K8s Service DNS 名
  port: "9090"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  persistence:
    size: "5Gi"

# Grafana 配置
grafana:
  enabled: true
  image: grafana/grafana:10.2.0
  adminUser: admin
  adminPassword: admin
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
  persistence:
    size: "2Gi"

# Test Runner 配置 (可选 — 默认禁用)
# 激活: helm install ... --set testRunner.enabled=true
testRunner:
  enabled: false
