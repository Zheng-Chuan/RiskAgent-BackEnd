image:
  repository: riskagent/backend
  tag: k8s-local
  pullPolicy: IfNotPresent

ingress:
  enabled: false

mcp:
  replicas: "1"
  resources:
    requests:
      cpu: "250m"
      memory: "384Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

mysql:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  persistence:
    size: "5Gi"

redis:
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  persistence:
    size: "2Gi"

chroma:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    size: "2Gi"

prometheus:
  enabled: false

grafana:
  enabled: false

chroma:
  skillsCollection: riskagent-skills

llm:
  baseUrl: https://api.deepseek.com
  model: deepseek-v4-flash
  httpReferer: http://127.0.0.1:4174
  appTitle: RiskAgent Local E2E
  embeddingModel: BAAI/bge-m3
  embeddingBaseUrl: https://api.siliconflow.cn/v1

skill:
  queryRewriteEnabled: "true"
  queryRewriteTimeout: "3.0"
  queryRewriteCacheSize: "256"
  hybridVectorWeight: "0.7"

# 本地 E2E 集群: 前端与验收脚本不携带 Token, 显式开启逃生舱
# 生产环境严禁此配置 (values.yaml 默认 false)
security:
  allowUnauthenticated: "true"

# 本地 E2E 演示: 无人值守验收流程需要自动审批
# 生产环境必须为 false (values.yaml 默认)
hitl:
  autoApprove: "true"
