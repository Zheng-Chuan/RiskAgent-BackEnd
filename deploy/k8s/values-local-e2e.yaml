image:
  repository: riskagent/backend
  tag: k8s-local
  pullPolicy: IfNotPresent

ingress:
  enabled: false

mcp:
  replicas: "1"
  resources:
    requests:
      cpu: "250m"
      memory: "384Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

mysql:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  persistence:
    size: "5Gi"

redis:
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  persistence:
    size: "2Gi"

chroma:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    size: "2Gi"

prometheus:
  enabled: false

grafana:
  enabled: false

chroma:
  skillsCollection: riskagent-skills

llm:
  baseUrl: https://openrouter.ai/api/v1
  model: deepseek/deepseek-v4-pro
  httpReferer: http://127.0.0.1:4174
  appTitle: RiskAgent Local E2E
  embeddingModel: text-embedding-3-small

skill:
  queryRewriteEnabled: "true"
  queryRewriteTimeout: "3.0"
  queryRewriteCacheSize: "256"
  hybridVectorWeight: "0.7"
