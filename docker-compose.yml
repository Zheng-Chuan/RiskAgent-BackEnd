services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: riskagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-XiPL15NFRvcw6PecN9vK-A}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-riskagent}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-34ktfzUrRLI7L5xyrP19_A}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      # 迁移脚本自动执行 (Phase 5-8 新增表)
      - ./db/migrations/003_create_alerts_table.sql:/docker-entrypoint-initdb.d/003_create_alerts_table.sql
      - ./db/migrations/004_create_audit_events_table.sql:/docker-entrypoint-initdb.d/004_create_audit_events_table.sql
      - ./db/migrations/005_create_memory_store_table.sql:/docker-entrypoint-initdb.d/005_create_memory_store_table.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=223344
      --log-bin=mysql-bin
      --binlog_format=ROW
      --binlog_row_image=FULL
      --expire_logs_days=7
    healthcheck:
      test: ["CMD", "sh", "-lc", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riskagent-network
    restart: unless-stopped

  # Redis - 统一内存存储
  redis:
    image: redis:7-alpine
    container_name: riskagent-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: sh -c "redis-server --appendonly yes --save 60 1000 --requirepass $${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-9s-R5At6itSHSWex6L8how}
    volumes:
      - redis_data:/data
    networks:
      - riskagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Chroma - 向量数据库（用于知识检索）
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: riskagent-chroma
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - riskagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # RiskAgent BackEnd MCP 服务
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskagent-backend
    environment:
      # MySQL 配置
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-riskagent}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-34ktfzUrRLI7L5xyrP19_A}
      # Redis 配置 (统一内存, 带密码)
      REDIS_URL: redis://:${REDIS_PASSWORD:-9s-R5At6itSHSWex6L8how}@redis:6379/0
      # Chroma 配置
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      MEMORY_TTL_S: 86400
      MEMORY_MAX_LEN: 2000
      # 统一语义记忆配置
      SEMANTIC_MEMORY_ENABLED: ${SEMANTIC_MEMORY_ENABLED:-true}
      # LLM 配置 (Chat: DeepSeek 官方 API; Embedding: 硅基流动 SiliconFlow)
      # LLM_API_KEY / LLM_EMBEDDING_API_KEY 无默认值, 缺失即空, 请在本地 .env 中配置真实密钥
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-BAAI/bge-m3}
      LLM_EMBEDDING_BASE_URL: ${LLM_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      # 独立 embedding key; 为空时代码内回退 LLM_API_KEY
      LLM_EMBEDDING_API_KEY: ${LLM_EMBEDDING_API_KEY}
      # 应用配置
      APP_ENV: production
      LOG_LEVEL: INFO
      # 鉴权配置: 设置了 Token 则强制校验; 未设置时本地默认放行(仅限开发环境)
      RISKAGENT_API_TOKEN: ${RISKAGENT_API_TOKEN:-}
      RISKAGENT_ALLOW_UNAUTHENTICATED: ${RISKAGENT_ALLOW_UNAUTHENTICATED:-1}
      MCP_TRANSPORT: streamable-http
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: 8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    ports:
      # 绑定 localhost: 仅供本机访问, 避免暴露到局域网
      - "127.0.0.1:8000:8000"
    networks:
      - riskagent-network
    restart: unless-stopped

  # 测试运行器
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskagent-test
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-riskagent}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-34ktfzUrRLI7L5xyrP19_A}
      REDIS_URL: redis://:${REDIS_PASSWORD:-9s-R5At6itSHSWex6L8how}@redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      # 测试运行器访问受保护端点时的鉴权配置
      RISKAGENT_API_TOKEN: ${RISKAGENT_API_TOKEN:-}
      RISKAGENT_ALLOW_UNAUTHENTICATED: ${RISKAGENT_ALLOW_UNAUTHENTICATED:-1}
      APP_ENV: test
      LOG_LEVEL: INFO
      SEMANTIC_MEMORY_ENABLED: ${SEMANTIC_MEMORY_ENABLED:-true}
      # LLM 配置 (与 mcp-server 一致; 测试如需真实调用请在本地 .env 配置密钥)
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-BAAI/bge-m3}
      LLM_EMBEDDING_BASE_URL: ${LLM_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_EMBEDDING_API_KEY: ${LLM_EMBEDDING_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - riskagent-network
    entrypoint: ["bash", "-lc"]
    command: ["pytest tests/unit/ -v"]
    profiles:
      - dev

  # phpMyAdmin (数据库管理界面，可选)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: riskagent-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-admin}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-34ktfzUrRLI7L5xyrP19_A}
      UPLOAD_LIMIT: 300M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - mysql
    networks:
      - riskagent-network
    restart: unless-stopped
    profiles:
      - tools

  # Prometheus - 监控和告警 (内存限制 512MB)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: riskagent-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - riskagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - monitoring

  # Grafana - 可视化面板 (内存限制 512MB)
  grafana:
    image: grafana/grafana:10.2.0
    container_name: riskagent-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-A5aIGZZdwSkRQeCxhkciBA}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      - prometheus
    networks:
      - riskagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - monitoring

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  riskagent-network:
    driver: bridge
