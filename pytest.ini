[pytest]
asyncio_mode = auto
filterwarnings =
    error
    ignore:notifyAll.*:DeprecationWarning
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:pkg_resources is deprecated as an API.*:UserWarning
    ignore::pytest.PytestReturnNotNoneWarning
    # chromadb 0.5.x 在实例上访问 pydantic model_fields, pydantic>=2.11 起告警
    ignore:Accessing the 'model_fields' attribute on the instance is deprecated.*
markers =
    asyncio: mark async tests managed by pytest-asyncio
